[project]
name = "jarvis-api"
version = "0.1.0"
description = "JARVIS API — FastAPI-Gateway, Persistenz, WebSocket"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jarvis-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "python-multipart>=0.0.20",
    "webauthn>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_api"]

[tool.uv.sources]
jarvis-contracts = { workspace = true }
