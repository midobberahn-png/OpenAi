[project]
name = "jarvis"
version = "0.1.0"
description = "Persönliches KI-Assistenzsystem"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jarvis-contracts",
    "jarvis-core",
    "jarvis-integrations",
    "jarvis-providers",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "freezegun>=1.5",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.uv.workspace]
# Weitere Mitglieder (apps/worker, apps/scheduler, apps/edge) werden in den
# jeweiligen Phasen ergänzt.
members = ["packages/*", "apps/api"]

[tool.uv.sources]
jarvis-contracts = { workspace = true }
jarvis-core = { workspace = true }
jarvis-integrations = { workspace = true }
jarvis-providers = { workspace = true }


# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "C4",          # comprehensions
    "SIM",         # simplify
    "TID",         # tidy-imports (Schichtgrenzen)
    "RUF",
]
ignore = [
    "E501",    # Zeilenlänge übernimmt der Formatter
    "N818",    # Fehlerklassen müssen nicht auf "Error" enden
    "B008",    # FastAPI Depends() im Default ist idiomatisch
    # Die Codebasis ist durchgehend deutschsprachig: Anführungszeichen („ “),
    # Gedankenstriche (–) und das Malzeichen (×) sind gewollt, nicht
    # versehentlich eingefügte Homoglyphen.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "TID251"]
# Die Schichtgrenze unten (banned-api) wirkt in Ruff global. Gemeint ist aber
# nur eine Richtung: aus `contracts` heraus darf nichts nach oben importiert
# werden. Deshalb bleibt TID251 ausschließlich in packages/contracts aktiv;
# überall sonst ist der Import der eigenen bzw. tieferen Schicht legitim.
"packages/core/**" = ["TID251"]
# Die Adapterschicht darf sich selbst importieren — die Schranke meint die
# Richtung nach oben, nicht das eigene Paket.
"packages/providers/**" = ["TID251"]
"packages/integrations/**" = ["TID251"]
"apps/**" = ["TID251"]
"scripts/**" = ["TID251"]
# PgUUID hält den PostgreSQL-Typ vom gleichnamigen uuid.UUID auseinander;
# die Umbenennung ist Absicht.
"apps/api/jarvis_api/db/*.py" = ["N811"]
"apps/api/jarvis_api/migrations/versions/*.py" = ["N811", "E501"]

# Schichtgrenze erzwingen (docs/02-repo-struktur.md §1). Wirksam nur in
# packages/contracts — siehe per-file-ignores oben. Erlaubte Richtung:
#   apps → core → contracts,  providers/integrations → core → contracts
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"jarvis_core".msg = "contracts importiert nichts aus dem Projekt (Schichtgrenze)."
"jarvis_api".msg = "contracts importiert nichts aus dem Projekt (Schichtgrenze)."
"jarvis_providers".msg = "Nur über Ports in jarvis_core.ports zugreifen."
"jarvis_integrations".msg = "Nur über Ports in jarvis_core.ports zugreifen."

[tool.ruff.lint.isort]
known-first-party = [
    "jarvis_contracts",
    "jarvis_core",
    "jarvis_api",
    "jarvis_providers",
    "jarvis_integrations",
]


# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^apps/web/", "build/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false


# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: benötigt Postgres/Redis",
    "eval: Modellverhalten, langsam",
    "security: Injection- und Policy-Suite",
    # Bindet einen Test an eine Invariante aus jarvis_core.policy.invariants.
    # Ein Marker auf eine unbekannte Kennung lässt die Suite fehlschlagen.
    "invariant(id): belegt eine Sicherheits-Invariante",
]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
