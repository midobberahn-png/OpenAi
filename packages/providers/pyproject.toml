[project]
name = "jarvis-providers"
version = "0.1.0"
description = "JARVIS Anbieteradapter — die einzige Stelle mit Provider-SDKs (ADR-009)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jarvis-contracts",
    "jarvis-core",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_providers"]

[tool.uv.sources]
jarvis-contracts = { workspace = true }
jarvis-core = { workspace = true }
