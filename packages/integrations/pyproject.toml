[project]
name = "jarvis-integrations"
version = "0.1.0"
description = "JARVIS Fremdsystemadapter — Dateisystem, Mail, Kalender (docs/02 §Repo-Struktur)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jarvis-contracts",
    "jarvis-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_integrations"]

[tool.uv.sources]
jarvis-contracts = { workspace = true }
jarvis-core = { workspace = true }
