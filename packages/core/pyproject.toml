[project]
name = "jarvis-core"
version = "0.1.0"
description = "JARVIS Kern — Orchestrator, Policy, Taint, Audit, Gedächtnis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jarvis-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_core"]

[tool.uv.sources]
jarvis-contracts = { workspace = true }
